[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cultivars"
dynamic = ["version"]
description = "Research-grade time series econometrics: ARIMA to state space, VAR to structural identification, Bayesian and spectral methods."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Nikhil Sunder", email = "nsunder724@gmail.com" }
]
requires-python = ">=3.12,<4.0"
keywords = [
    "econometrics", "time series", "vector autoregression", "VAR", "state space", "Kalman filter",
    "Bayesian", "spectral analysis", "forecasting", "macroeconomics",
]
classifiers = [
    'Programming Language :: Python',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
dependencies = [
    "numpy",
#    "numba",
    "scipy",
    "fedfred",
]

[project.optional-dependencies]
pandas = ["pandas"]
polars = ["polars"]
# cuda-12 = ["cupy-cuda12x"]
# cuda-13 = ["cupy-cuda13x"]
# rocm = ["cupy-rocm-7-0"]
# mlx = ["mlx"]


[project.urls]
Repository    = "https://github.com/nikhilxsunder/cultivars/tree/dev"
Documentation = "https://nikhilxsunder.github.io/cultivars/"

# ── Composable dependency groups ─────────────────────────────────────────────
# Each group is independently installable; `dev` composes all of them.
# CI jobs use the minimal group they need (e.g. --group test for test runs).

[dependency-groups]
extras = [ "pandas", "polars" ]
types = [
    "scipy-stubs",
]
test = [
    "pytest",
    "pytest-cov",
    "pytest-asyncio",
    "pytest-mock",
    "hypothesis",
    { include-group = "types" },
]
lint = [
    "ruff",
    "mypy",
    "bandit",
    "pip-audit",
    { include-group = "types" },
]
docs = [
    "sphinx",
    "pydata-sphinx-theme",
    "sphinx-design",
    "sphinx-autodoc-typehints",
    "myst-parser",
    "linkify-it-py",
    "sphinx-sitemap",
    "sphinxext-opengraph",
    "matplotlib",
]
notebooks = [
    "jupyterlab",
    "ipykernel",
    "ipympl",
    "ipywidgets",
    "jupyterlab-lsp",
    "nbdime",
    "notebook",
    "matplotlib",
]
dev = [
    { include-group = "types" },
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "docs" },
    { include-group = "notebooks" },
]

# ── uv config ────────────────────────────────────────────────────────────────

[tool.uv]
managed = true

# ── build ────────────────────────────────────────────────────────────────────

[tool.hatch.version]
path = "src/cultivars/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/cultivars"]

[tool.hatch.build.targets.sdist]
exclude = [
    ".docs",
    ".github",
    ".vscode",
    "assets",
    "benchmarks",
    "conda-forge",
    "conda-recipe",
    "docs",
    "examples",
    "node_modules",
    "paper",
    "*.md",
    "!README.md",
    "!CHANGELOG.md",
]

# ── tool configs ─────────────────────────────────────────────────────────────

[tool.mypy]
files = "src/cultivars"
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ANN", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.bandit]
exclude_dirs = ["tests", "docs"]

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=term-missing --cov-report=html"
testpaths = ["tests"]
pythonpath = "src"

[tool.coverage.run]
source = ["src"]
omit = [
    "tests/*",
    "*/tests/*",
    "*_test.py",
]


[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    '@(typing\.)?overload',
]
