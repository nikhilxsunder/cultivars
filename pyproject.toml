[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cultivars"
version = "0.0.1"
description = "A modern computing library in python for providing vector autoregressions and similar economic models."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Nikhil Sunder", email = "nsunder724@gmail.com" }
]
requires-python = ">=3.10,<4.0"
keywords = [
    "vector autoregression", "VAR", "econometrics", "time series", "economic modeling", "financial modeling"
]
classifiers = [
    'Programming Language :: Python',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial :: Investment"
]
dependencies = [
    "numpy",
    "scipy",
    "fedfred",
]

[project.optional-dependencies]

[project.urls]
Repository    = "https://github.com/nikhilxsunder/cultivars"
Documentation = "https://nikhilxsunder.github.io/cultivars/"

# ── Composable dependency groups ─────────────────────────────────────────────
# Each group is independently installable; `dev` composes all of them.
# CI jobs use the minimal group they need (e.g. --group test for test runs).

[dependency-groups]
types = [
    "scipy-stubs"
]
test = [
    "pytest",
    "pytest-cov",
    "pytest-asyncio",
    "pytest-mock",
    "hypothesis",
    { include-group = "types" },
]
lint = [
    "ruff",
    "mypy",
    "bandit",
    "pip-audit",
    { include-group = "types" },
]
docs = [
    "sphinx",
    "pydata-sphinx-theme",
    "sphinx-design",
    "sphinx-autodoc-typehints",
    "myst-parser",
    "linkify-it-py",
    "sphinx-sitemap",
    "sphinxext-opengraph",
    "matplotlib",
]
notebooks = [
    "ipykernel",
    "notebook",
]
extras = []
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "docs" },
    { include-group = "notebooks" },
    { include-group = "extras" },
]

# ── uv config ────────────────────────────────────────────────────────────────

[tool.uv]
managed = true

# ── build ────────────────────────────────────────────────────────────────────

[tool.hatch.build.targets.wheel]
packages = ["src/cultivars"]

# ── tool configs ─────────────────────────────────────────────────────────────

[tool.mypy]
files = "src/cultivars"
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ANN", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.bandit]
exclude_dirs = ["tests", "docs"]

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=term-missing --cov-report=html"
testpaths = ["tests"]
pythonpath = "src"

[tool.coverage.run]
source = ["src"]
omit = [
    "tests/*",
    "*/tests/*",
    "*_test.py",
]


[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    '@(typing\.)?overload',
]
