name: Build and Deploy Docs

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Which build to (re)deploy: dev, stable, or a release like 1.0.0a1"
        required: true
        default: dev
      strict:
        description: "Treat Sphinx warnings and failing gallery examples as errors"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

# One deploy at a time: every job pushes to the gh-pages branch.
concurrency:
  group: gh-pages
  cancel-in-progress: false

env:
  DOCS_BASE_URL: https://nikhilxsunder.github.io/cultivars/
  PYTHON_VERSION: "3.14"
  # Non-interactive backend for sphinx-gallery; no display on the runner.
  MPLBACKEND: Agg

jobs:
  # Decide what this run builds. main -> stable, dev -> dev, a tag -> its own
  # numbered directory, a manual run -> what it was asked for. stable is built
  # from main rather than from the tag so documentation fixes merged after a
  # release reach the site without waiting for the next one.
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        shell: bash
        env:
          REQUESTED: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          case "${GITHUB_EVENT_NAME}" in
            workflow_dispatch)
              v="${REQUESTED}"
              if [ "$v" = "dev" ]; then ref=dev; elif [ "$v" = "stable" ]; then ref=main; else ref="v${v}"; fi
              builds="[{\"version\":\"$v\",\"ref\":\"$ref\"}]" ;;
            *)
              if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
                tag="${GITHUB_REF#refs/tags/}"; ver="${tag#v}"
                builds="[{\"version\":\"$ver\",\"ref\":\"$tag\"}]"
              elif [ "${GITHUB_REF_NAME}" = "main" ]; then
                builds='[{"version":"stable","ref":"main"}]'
              else
                builds='[{"version":"dev","ref":"dev"}]'
              fi ;;
          esac
          echo "matrix=$builds" >> "$GITHUB_OUTPUT"
          echo "plan: $builds"

  build:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        include: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --group docs

      # Warnings are logged, counted and surfaced, but do not fail the build
      # unless the run was dispatched with strict=true. A failing gallery
      # example renders as a warning for the same reason (see conf.py:
      # sphinx_gallery_conf["only_warn_on_example_error"]). Extension errors
      # -- a missing gallery header, a broken conf.py -- are still fatal,
      # because there is nothing to deploy when Sphinx cannot start.
      - name: Build docs
        id: sphinx
        shell: bash
        env:
          DOCS_VERSION: ${{ matrix.version }}
          DOCS_GIT_REF: ${{ matrix.ref }}
          STRICT: ${{ github.event.inputs.strict == 'true' && '1' || '0' }}
        run: |
          set -euo pipefail
          rm -rf docs/source/*/generated
          log="$(pwd)/docs/build/sphinx-warnings.log"
          mkdir -p docs/build
          opts="-j auto --keep-going -w ${log}"
          if [ "${STRICT}" = "1" ]; then
            opts="${opts} -W"
            echo "strict: warnings are errors"
          fi
          uv run --no-sync make -C docs html SPHINXOPTS="${opts}"
          test -f docs/build/html/index.html
          count=$(grep -c . "${log}" || true)
          echo "warnings=${count}" >> "$GITHUB_OUTPUT"
          {
            echo "### Docs build: ${DOCS_VERSION} (${DOCS_GIT_REF})"
            echo
            echo "Sphinx warnings: **${count}**"
            if [ "${count}" -gt 0 ]; then
              echo
              echo '<details><summary>first 50</summary>'
              echo
              echo '```'
              head -n 50 "${log}"
              echo '```'
              echo '</details>'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload warnings log
        if: always() && steps.sphinx.outputs.warnings != '0'
        uses: actions/upload-artifact@v6
        with:
          name: sphinx-warnings-${{ matrix.version }}
          path: docs/build/sphinx-warnings.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Deploy ${{ matrix.version }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/build/html
          destination_dir: ${{ matrix.version }}
          commit_message: "docs: deploy ${{ matrix.version }} from ${{ matrix.ref }} (${{ github.sha }})"

  # Root of the site: redirect, robots.txt, the switcher list, the IndexNow
  # key. keep_files is what protects the version directories from this push.
  root:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --group docs

      - name: Assemble root
        shell: bash
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          set -euo pipefail
          mkdir -p site-root
          cp docs/root/index.html docs/root/robots.txt site-root/
          uv run --no-sync python docs/switcher.py write \
            --base-url "${DOCS_BASE_URL}" --output site-root/switcher.json
          if [ -n "${INDEXNOW_KEY}" ]; then
            echo "${INDEXNOW_KEY}" > "site-root/${INDEXNOW_KEY}.txt"
          else
            echo "::warning::INDEXNOW_KEY secret is unset; skipping key file"
          fi

      - name: Deploy root
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site-root
          keep_files: true
          commit_message: "docs: refresh site root (${{ github.sha }})"

      # Best effort: a search-engine ping must never fail a deploy.
      - name: Notify IndexNow (Bing)
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        shell: bash
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${INDEXNOW_KEY}" ]; then
            echo "::warning::INDEXNOW_KEY secret is unset; skipping IndexNow"
            exit 0
          fi
          base="${DOCS_BASE_URL%/}"
          payload=$(printf '{"host":"nikhilxsunder.github.io","key":"%s","keyLocation":"%s/%s.txt","urlList":["%s/stable/","%s/stable/sitemap.xml"]}' \
            "$INDEXNOW_KEY" "$base" "$INDEXNOW_KEY" "$base" "$base")
          echo "$payload" | curl -sS --fail-with-body -X POST "https://www.bing.com/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" --data-binary @-
          echo "IndexNow notification sent."
